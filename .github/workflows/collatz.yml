name: Collatz Research

on:
  workflow_dispatch:
    inputs:

      limit:
        description: "Tarama limiti"
        required: true
        default: "1000000"

      max_steps:
        description: "Maksimum adım"
        required: true
        default: "1000000"

      workers:
        description: "CPU worker sayısı"
        required: true
        default: "4"

jobs:

  research:

    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:

      - name: Repo indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sistem bilgisi
        run: |
          python --version
          nproc

      - name: Collatz araştırmasını çalıştır
        env:
          LIMIT: ${{ inputs.limit }}
          MAX_STEPS: ${{ inputs.max_steps }}
          WORKERS: ${{ inputs.workers }}
          OUTPUT_DIR: reports

        run: python collatz.py

      - name: Rapor yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collatz-report
          path: reports/
